<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect4 Home Assistant</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --panel-2: #222c42;
    --text: #e8edf6; --muted: #93a0b8; --accent: #4f8cff;
    --ok: #3ecf8e; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 18px; background: var(--panel);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid #2b3650;
  }
  header h1 { font-size: 1.05rem; margin: 0; }
  .badge {
    font-size: .75rem; padding: 3px 10px; border-radius: 999px;
    background: var(--panel-2); color: var(--muted);
  }
  .badge.ok { color: var(--ok); }
  .badge.bad { color: var(--bad); }
  #conn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; font-weight: 600; font-size: .95rem;
    border-bottom: 1px solid #2b3650; background: var(--panel);
  }
  #conn .mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%; font-size: 1rem;
    color: #fff; background: #555; flex: none;
  }
  #conn.ok .mark { background: var(--ok); }
  #conn.ok { color: var(--ok); }
  #conn.bad .mark { background: var(--bad); }
  #conn.bad { color: var(--bad); }
  #conn.checking { color: var(--muted); }
  main {
    display: flex; flex: 1; min-height: 0;
  }
  #chat {
    flex: 1; display: flex; flex-direction: column; min-width: 0;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 18px; display: flex;
    flex-direction: column; gap: 10px;
  }
  .msg { max-width: 76%; padding: 10px 14px; border-radius: 14px;
         white-space: pre-wrap; line-height: 1.45; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff;
              border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: var(--panel-2);
              border-bottom-left-radius: 4px; }
  .msg.err  { align-self: center; background: #3a2030; color: var(--bad);
              font-size: .85rem; }
  .actions { font-size: .72rem; color: var(--muted); margin: -4px 0 0 6px; }
  form {
    display: flex; gap: 10px; padding: 14px 18px; background: var(--panel);
    border-top: 1px solid #2b3650;
  }
  input[type=text] {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #2b3650;
    background: var(--bg); color: var(--text); font-size: 1rem; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 1rem;
  }
  button:disabled { opacity: .5; cursor: default; }
  #devices {
    width: 280px; overflow-y: auto; background: var(--panel);
    border-left: 1px solid #2b3650; padding: 14px; display: none;
  }
  @media (min-width: 820px) { #devices { display: block; } }
  #devices h2 { font-size: .8rem; text-transform: uppercase;
                letter-spacing: .06em; color: var(--muted); margin: 4px 0 10px; }
  .dev { background: var(--panel-2); border-radius: 10px; padding: 9px 12px;
         margin-bottom: 8px; font-size: .85rem; }
  .dev .name { font-weight: 600; }
  .dev .state { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 6px; background: #555; }
  .dot.on { background: var(--ok); }
</style>
</head>
<body>
<header>
  <h1>🏠 Connect4 Home Assistant</h1>
  <span class="badge" id="model-badge"></span>
</header>
<div id="conn" class="checking">
  <span class="mark" id="conn-mark">○</span>
  <span id="conn-text">Checking connection to your smarthome…</span>
</div>
<main>
  <section id="chat">
    <div id="messages">
      <div class="msg bot">Hi! I'm your Connect4 home assistant. I can control your lights, speakers, and TVs — try "turn on the living room lights" or "play some jazz in the kitchen".</div>
    </div>
    <form id="form">
      <input id="input" type="text" placeholder="Tell me what to do…" autocomplete="off" autofocus>
      <button id="send" type="submit">Send</button>
    </form>
  </section>
  <aside id="devices">
    <h2>Devices</h2>
    <div id="device-list"></div>
  </aside>
</main>
<script>
const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const history = [];

let accessCode = localStorage.getItem('connect4-access-code') || '';

function askForCode(message) {
  const entered = window.prompt(message || 'Enter your Connect4 access code:');
  if (entered !== null) {
    accessCode = entered.trim();
    localStorage.setItem('connect4-access-code', accessCode);
  }
  return entered !== null;
}

// fetch wrapper that attaches the access code and re-prompts once on 401
async function apiFetch(path, opts = {}) {
  opts.headers = { ...(opts.headers || {}), 'X-Access-Code': accessCode };
  let r = await fetch(path, opts);
  if (r.status === 401) {
    if (askForCode('Access code required to control the home:')) {
      opts.headers['X-Access-Code'] = accessCode;
      r = await fetch(path, opts);
    }
  }
  return r;
}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addActions(actions) {
  const acted = actions.filter(a => a.tool !== 'list_devices' && a.result && a.result.ok);
  if (!acted.length) return;
  const div = document.createElement('div');
  div.className = 'actions';
  div.textContent = '⚙ ' + acted.map(a => a.result.device.name).join(', ') + ' updated';
  messagesEl.appendChild(div);
}

function setConn(state, mark, text) {
  document.getElementById('conn').className = state;
  document.getElementById('conn-mark').textContent = mark;
  document.getElementById('conn-text').textContent = text;
}

async function refreshStatus() {
  try {
    const r = await fetch('/api/status');
    if (!r.ok) throw new Error();
    const s = await r.json();
    document.getElementById('model-badge').textContent = '🧠 ' + s.model;
    if (s.access_code_required && !accessCode) askForCode();
  } catch { /* the ping below reports connectivity */ }
  await refreshConnection();
  refreshDevices();
}

// The checkmark reflects a real end-to-end check: a successful ping means
// every gate (WiFi / access code) passed and the smarthome responded.
async function refreshConnection() {
  try {
    const r = await apiFetch('/api/ping');
    if (r.ok) {
      setConn('ok', '✓', 'Connected to your smarthome');
    } else if (r.status === 401) {
      setConn('bad', '✕', 'Access code needed — reload this page to enter it.');
    } else {
      setConn('bad', '✕', 'Not connected — join the home WiFi to control the smarthome.');
    }
  } catch {
    setConn('bad', '✕', 'Not connected — join the home WiFi to control the smarthome.');
  }
}

async function refreshDevices() {
  try {
    const r = await apiFetch('/api/devices');
    if (!r.ok) return;
    const { devices } = await r.json();
    const list = document.getElementById('device-list');
    list.innerHTML = '';
    for (const d of devices) {
      const el = document.createElement('div');
      el.className = 'dev';
      const extras = [];
      if (d.type === 'light') extras.push(d.brightness + '%', d.color);
      if (d.type === 'speaker') extras.push('vol ' + d.volume, d.playing ? ('▶ ' + (d.track || 'playing')) : '⏸');
      if (d.type === 'tv') extras.push('vol ' + d.volume, d.channel || d.input);
      el.innerHTML = '<div class="name"><span class="dot ' + (d.power ? 'on' : '') + '"></span>' +
        d.name + '</div><div class="state">' + (d.power ? 'on · ' : 'off · ') +
        extras.join(' · ') + '</div>';
      list.appendChild(el);
    }
  } catch { /* panel is best-effort; the checkmark comes from refreshConnection */ }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  history.push({ role: 'user', content: text });
  send.disabled = true;
  const thinking = addMsg('…', 'bot');
  try {
    const r = await apiFetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    const data = await r.json();
    thinking.remove();
    if (!r.ok) {
      addMsg(data.detail || data.error || 'Request failed', 'err');
    } else {
      addMsg(data.reply, 'bot');
      history.push({ role: 'assistant', content: data.reply });
      addActions(data.actions || []);
      refreshDevices();
    }
  } catch {
    thinking.remove();
    addMsg('Could not reach the Connect4 server. Are you on the home WiFi?', 'err');
  } finally {
    send.disabled = false;
    input.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
});

refreshStatus();
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
